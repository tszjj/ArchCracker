#
# Dependency/license gate. Keep the allow-list limited to licenses that are
# compatible with GPL-3.0-only. RAR/unRAR code is never a dependency; see
# docs/adr/0003-rar-licensing.md.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "GPL-3.0-only",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
