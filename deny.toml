#
# Dependency/license gate. Keep the allow-list limited to licenses that are
# compatible with Apache-2.0. RAR/unRAR code is never a dependency; see
# docs/adr/0003-rar-licensing.md.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # sevenz-rust2's bzip2/ppmd readers.
    "bzip2-1.0.6",
    "CC0-1.0",
    "MIT-0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
