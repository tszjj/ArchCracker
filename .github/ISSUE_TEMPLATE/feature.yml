name: Feature request
description: 提出功能/平台/性能建议
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 不要从“实现方案”开始，先说场景/痛点。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: dropdown
    id: platforms
    attributes:
      label: 影响平台
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - Android
        - HarmonyOS
        - Core/CLI
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案/取舍
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 不涉及未授权访问/在线撞库
          required: true
        - label: 不引入 unRAR/7-Zip RAR 代码（除非走 ADR-0003 流程）
          required: true
