name: Bug report
description: 报告可复现的缺陷（不要上传真实归档/密码）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要上传真实归档、口令、用户数据或未脱敏日志。安全漏洞请用私密渠道（SECURITY.md）。
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本/commit
      placeholder: v0.0.1 / <commit>
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - Linux
        - macOS
        - Android
        - HarmonyOS
        - CLI only
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: 归档格式/加密
      placeholder: 7z / ZIP AES / RAR5 / 分卷 / SFX ...
  - type: textarea
    id: logs
    attributes:
      label: 日志/错误码
      description: 脱敏后的输出；不要包含真实密码。
  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我拥有该归档或已获授权，可提供脱敏后的最小复现
          required: true
