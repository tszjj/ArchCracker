name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: build
        run: cargo build --workspace --release --locked

      - name: C header smoke (C99 + C++)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -I crates/acx-ffi/include -c crates/acx-ffi/tests/header_smoke.c -o /tmp/acx_header_c.o
          c++ -std=c++17 -Wall -Wextra -Werror -I crates/acx-ffi/include -c crates/acx-ffi/tests/header_smoke.c -o /tmp/acx_header_cpp.o

      - name: upload ffi artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acx-ffi-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            core/target/release/acx.dll
            core/target/release/acx.exe
            core/target/release/libacx.so
            core/target/release/libacx.dylib
            core/crates/acx-ffi/include/acx.h

  ffi-smoke:
    name: ffi smoke + Avalonia shell (C/C++/C#/.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build acx-ffi
        working-directory: core
        run: cargo build -p acx-ffi --locked

      - name: C99 header smoke
        working-directory: core
        run: gcc -std=c99 -Wall -Wextra -Werror -I crates/acx-ffi/include -c crates/acx-ffi/tests/header_smoke.c -o header_smoke.o

      - name: C++17 header smoke
        working-directory: core
        run: c++ -std=c++17 -Wall -Wextra -Werror -I crates/acx-ffi/include -c crates/acx-ffi/tests/header_smoke.c -o header_smoke_cpp.o

      - name: C# P/Invoke smoke
        run: dotnet run --project frontends/desktop/tests/AcxFfiSmoke/AcxFfiSmoke.csproj -c Release -- core/target/debug/acx.dll

      - name: Avalonia shell build
        run: dotnet build frontends/desktop/src/ArchCracker.Desktop/ArchCracker.Desktop.csproj -c Release

      - name: Avalonia shell tests
        run: dotnet run --project frontends/desktop/tests/ArchCracker.Desktop.Tests/ArchCracker.Desktop.Tests.csproj -c Release

  windows-gnu:
    name: rust (windows-latest, gnu)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2/MinGW
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Install Rust (GNU target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: test (GNU)
        working-directory: core
        run: cargo test --workspace --locked --target x86_64-pc-windows-gnu

  msrv:
    name: rust (msrv 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89

      - name: test
        working-directory: core
        run: cargo test --workspace --locked

  licenses:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
          manifest-path: core/Cargo.toml
          arguments: --all-features
