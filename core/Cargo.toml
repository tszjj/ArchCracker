[workspace]
resolver = "2"
members = [
    "crates/acx-core",
    "crates/acx-cli",
    "crates/acx-ffi",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["ArchCracker contributors"]
description = "Cross-platform archive password recovery core"

[profile.release]
# Keep unwind so the C ABI can catch panics and return ACX_ERR_PANIC.
# Symbols are kept for crash dumps; strip them in the packaging pipeline instead.
lto = "thin"
codegen-units = 1
