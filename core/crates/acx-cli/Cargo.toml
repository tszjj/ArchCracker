[package]
name = "acx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ArchCracker command-line interface"

[[bin]]
name = "acx"
path = "src/main.rs"

[dependencies]
acx-core = { path = "../acx-core", version = "0.0.1" }
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
zip = { version = "9.8.2", default-features = false, features = ["deflate", "aes-crypto"] }
sevenz-rust2 = "0.20.2"
